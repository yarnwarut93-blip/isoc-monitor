<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISOC01 - SIGNAL DEFENDER (SECURE)</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; margin: 0; overflow-x: hidden; }
        .panel { border: 2px solid #0f0; padding: 15px; margin-bottom: 20px; background: rgba(0, 255, 0, 0.05); position: relative; }
        .log-box { height: 300px; border: 1px solid #333; overflow-y: auto; padding: 10px; font-size: 12px; color: #00ff41; background: #050505; }
        .critical { color: #ff3e3e; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        button { background: #0f0; color: #000; border: none; padding: 15px; width: 100%; cursor: pointer; font-weight: bold; font-size: 16px; border-radius: 4px; box-shadow: 0 0 10px #0f0; }
        .security-tag { font-size: 10px; color: #888; text-align: right; margin-top: 5px; }
    </style>
</head>
<body id="main-body">
    <div class="panel" id="ui-header">
        <div>🛡️ <b>ISOC01: SIGNAL DEFENDER</b></div>
        <div>🆔 ID: 1425101665</div>
        <div>📡 STATUS: <span id="status">INITIALIZING...</span></div>
        <div>⏰ TIME: <span id="clock">--:--:--</span></div>
        <div class="security-tag">ANTI-TAMPERING: ACTIVE</div>
    </div>

    <div class="log-box" id="logs">
        [SYSTEM] Integrity Check: PASSED<br>
        [SYSTEM] Loading Encrypted Logs...
    </div>
    <br>
    <button onclick="handleScan()">ACTIVATE SECURITY SCAN</button>

    <script>
        const SB_URL = "https://wmqzowyegkyrhlqsforb.supabase.co";
        const SB_KEY = "sb_publishable_ZziZCfjeYMaxhmJrOHwhSg_tzY-h5IM";

        // --- 1. ระบบป้องกันการแทรกแซง (Anti-Tampering) ---
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.addedNodes.length) {
                    mutation.addedNodes.forEach(node => {
                        if (node.tagName === 'SCRIPT' || node.id === 'malicious-ui') {
                            node.remove(); // ลบสคริปต์แปลกปลอมทันที
                            reportViolation("UNAUTHORIZED_INJECTION");
                        }
                    });
                }
            });
        });
        observer.observe(document.body, { childList: true, subtree: true });

        // --- 2. ระบบดึงข้อมูลและรายงานสถานะ ---
        async function updateUI() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
            const hour = now.getHours();
            const status = document.getElementById('status');
            if (hour >= 16 || hour < 6) {
                status.innerText = "[CRITICAL-WATCH]";
                status.className = "critical";
            } else {
                status.innerText = "[NORMAL-MONITORING]";
                status.className = "";
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch(`${SB_URL}/rest/v1/event?select=*&order=created_at.desc&limit=5`, {
                    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
                });
                const data = await res.json();
                const logBox = document.getElementById('logs');
                logBox.innerHTML = "[SYSTEM] Cloud Sync Complete.<br>";
                data.forEach(item => {
                    const t = new Date(item.created_at).toLocaleTimeString();
                    logBox.innerHTML += `[${t}] > ${item.event_type}: ${item.status}<br>`;
                });
            } catch (e) { console.log("Sync Error"); }
        }

        async function handleScan() {
            const time = new Date().toLocaleTimeString();
            document.getElementById('logs').prepend(document.createElement('div')).innerText = `[${time}] > ⚡ SCANNING...`;
            
            try {
                await fetch(`${SB_URL}/rest/v1/event`, {
                    method: 'POST',
                    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id_num: "1425101665",
                        event_type: "SECURITY_SCAN",
                        status: "SUCCESS"
                    })
                });
                loadHistory(); // ดึงประวัติใหม่มาโชว์ทันที
            } catch (err) { reportViolation("DB_CONNECTION_LOST"); }
        }

        async function reportViolation(type) {
            await fetch(`${SB_URL}/rest/v1/event`, {
                method: 'POST',
                headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ id_num: "1425101665", event_type: "ALERT", status: type })
            });
        }

        setInterval(updateUI, 1000);
        window.onload = () => { updateUI(); loadHistory(); };
    </script>
    <div class="panel" style="border-color: #0080ff; background: rgba(0, 128, 255, 0.05);">
    <div style="color: #0080ff;">🤖 <b>AI SECURITY ANALYST: ONLINE</b></div>
    <div id="ai-response" style="font-size: 12px; margin: 10px 0; min-height: 40px; color: #aaa;">
        รอรับคำสั่ง... หรือกดปุ่มสแกนเพื่อให้ผมวิเคราะห์สถานะล่าสุดครับ
    </div>
    <input type="text" id="ai-input" placeholder="สอบถาม AI เกี่ยวกับความปลอดภัย..." 
           style="width: 80%; background: #111; color: #0f0; border: 1px solid #0080ff; padding: 5px;">
    <button onclick="askAI()" style="width: 18%; background: #0080ff; font-size: 12px; padding: 5px;">ASK</button>
    </div>
    
</body>
    </html>
