<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISOC01 - TRUE MONITOR</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        .panel { border: 1px solid #0f0; padding: 15px; margin-bottom: 20px; }
        .log-box { height: 300px; border: 1px solid #333; overflow-y: scroll; padding: 10px; font-size: 12px; color: #00ff41; }
        .critical { color: #ff3e3e; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        button { background: #0f0; color: #000; border: none; padding: 10px; width: 100%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="panel">
        <h3>🛡️ ISOC01: ACTIVE (ID: 1425101665)</h3>
        <div>STATUS: <span id="status">INIT...</span></div>
        <div>TIME: <span id="clock">--:--:--</span></div>
    </div>
    <div class="log-box" id="logs">
        [SYSTEM] Monitoring True Mobile Network...<br>
        [SYSTEM] Standby for security events...
    </div>
    <br>
    <button onclick="sendScan()">ACTIVATE SECURITY SCAN</button>

    <script>
        function update() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
            const hour = now.getHours();
            const status = document.getElementById('status');
            
            // เงื่อนไขเฝ้าระวัง 16:00 - 06:00
            if (hour >= 16 || hour < 6) {
                status.innerText = "[CRITICAL-WATCH]";
                status.className = "critical";
            } else {
                status.innerText = "[NORMAL]";
                status.className = "";
            }
        }
        function sendScan() {
            const l = document.getElementById('logs');
            l.innerHTML = `[${new Date().toLocaleTimeString()}] > SCANNING... SUCCESS<br>` + l.innerHTML;
            alert("Scan signal sent to ID 1425101665");
        }
        setInterval(update, 1000);
        update();
    </script>
</body>
</html>
