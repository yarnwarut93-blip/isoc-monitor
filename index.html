<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISOC01 - SIGNAL DEFENDER SUPREME</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; margin: 0; overflow-x: hidden; }
        .panel { border: 2px solid #0f0; padding: 15px; margin-bottom: 20px; background: rgba(0, 255, 0, 0.05); position: relative; }
        .log-box { height: 250px; border: 1px solid #333; overflow-y: auto; padding: 10px; font-size: 12px; color: #00ff41; background: #050505; margin-bottom: 10px; }
        .critical { color: #ff3e3e; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        button { background: #0f0; color: #000; border: none; padding: 15px; width: 100%; cursor: pointer; font-weight: bold; font-size: 16px; border-radius: 4px; box-shadow: 0 0 10px #0f0; }
        button:active { transform: scale(0.98); }
        .ai-panel { border: 2px solid #0080ff; background: rgba(0, 128, 255, 0.1); padding: 15px; border-radius: 4px; margin-top: 10px; }
        input { width: 75%; background: #111; color: #0f0; border: 1px solid #0080ff; padding: 8px; margin-top: 10px; }
        .ask-btn { width: 20%; background: #0080ff; padding: 8px; font-size: 12px; display: inline-block; vertical-align: middle; margin-top: 10px; margin-left: 2%; }
        .security-tag { font-size: 10px; color: #888; text-align: right; margin-top: 5px; }
    </style>
</head>
<body><audio id="alert-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
<audio id="warning-sound" src="https://actions.google.com/sounds/v1/alarms/emergency_it_is_an_emergency.ogg"></audio>

    <div class="panel">
        <div>🛡️ <b>ISOC01: SIGNAL DEFENDER</b></div>
        <div>🆔 ID: 1425101665</div>
        <div>📡 STATUS: <span id="status">INIT...</span></div>
        <div>⏰ TIME: <span id="clock">--:--:--</span></div>
        <div class="security-tag">ANTI-TAMPERING: ACTIVE</div>
    </div>

    <div class="log-box" id="logs">
        [SYSTEM] Checking Cloud Integrity...
    </div>

    <button onclick="handleScan()">ACTIVATE SECURITY SCAN</button>

    <div class="ai-panel">
        <div style="color: #0080ff; font-weight: bold;">🤖 AI SECURITY ANALYST: ONLINE</div>
        <div id="ai-response" style="font-size: 12px; margin: 10px 0; color: #aaa; min-height: 30px;">
            สวัสดีครับ ผมพร้อมช่วยคุณวิเคราะห์ความปลอดภัยแล้ว...
        </div>
        <input type="text" id="ai-input" placeholder="พิมพ์คำถามที่นี่...">
        <button class="ask-btn" onclick="askAI()">ASK</button>
    </div>

    <script>
        const SB_URL = "https://wmqzowyegkyrhlqsforb.supabase.co";
        const SB_KEY = "sb_publishable_ZziZCfjeYMaxhmJrOHwhSg_tzY-h5IM";

        // --- 1. ป้องกันการแทรกแซง UI ---
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((m) => {
                if (m.addedNodes.length) {
                    m.addedNodes.forEach(node => {
                        if (node.tagName === 'SCRIPT' || node.className === 'fake-ui') {
                            node.remove();
                            reportViolation("UI_INJECTION_DETECTED");
                        }
                    });
                }
            });
        });
        observer.observe(document.body, { childList: true, subtree: true });

        // --- 2. อัปเดตเวลาและสถานะเฝ้าระวัง ---
        function updateUI() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
            const hour = now.getHours();
            const statusEl = document.getElementById('status');
            if (hour >= 16 || hour < 6) {
                statusEl.innerText = "[CRITICAL-WATCH]";
                statusEl.className = "critical";
            } else {
                statusEl.innerText = "[NORMAL-MONITORING]";
                statusEl.className = "";
            }
        }

        // --- 3. ดึงประวัติย้อนหลังจาก Supabase ---
        async function loadHistory() {
            const logBox = document.getElementById('logs');
            try {
                const res = await fetch(`${SB_URL}/rest/v1/event?select=*&order=created_at.desc&limit=5`, {
                    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
                });
                const data = await res.json();
                logBox.innerHTML = "[SYSTEM] Cloud Sync Complete.<br>";
                data.forEach(item => {
                    const t = new Date(item.created_at).toLocaleTimeString();
                    logBox.innerHTML += `[${t}] > ${item.event_type}: ${item.status}<br>`;
                });
            } catch (e) { logBox.innerHTML = "[ERROR] Connection Failed."; }
        }

        // --- 4. ปุ่มสแกนบันทึกข้อมูล ---
        async function handleScan() {
            const time = new Date().toLocaleTimeString();
            const logBox = document.getElementById('logs');
            logBox.prepend(document.createElement('div')).innerText = `[${time}] > ⚡ SCANNING...`;

            try {
                await fetch(`${SB_URL}/rest/v1/event`, {
                    method: 'POST',
                    headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_num: "1425101665", event_type: "SECURITY_SCAN", status: "SUCCESS" })
                });
                loadHistory();
            } catch (err) { console.log("Post Failed"); }
        }

        // --- 5. ฟังก์ชันสมอง AI (แก้อาการค้าง) ---
        async function askAI() {
            const input = document.getElementById('ai-input').value;
            const resBox = document.getElementById('ai-response');
            if (!input) return;

            resBox.innerText = "🤖 กำลังประมวลผลข้อมูล...";
            resBox.style.color = "#0080ff";

            // จำลองการวิเคราะห์
            setTimeout(() => {
                let reply = "";
                if (input.includes("ตรวจสอบ") || input.includes("สถานะ")) {
                    reply = "วิเคราะห์: ระบบออนไลน์ 100% ตรวจพบตาราง event ใน Cloud แล้ว ความเสี่ยงระดับ: LOW";
                } else if (input.includes("ป้องกัน") || input.includes("hack")) {
                    reply = "คำแนะนำ: ระบบ Anti-Tampering กำลังป้องกัน UI ของคุณอยู่ ห้ามคลิกลิงก์แปลกปลอมนอกเหนือจากโดเมน github.io นี้ครับ";
                } else {
                    reply = `รับทราบครับ สำหรับ "${input}" ผมได้บันทึกความสนใจนี้ลงในระบบวิเคราะห์ความปลอดภัยแล้วครับ`;
                }
                resBox.innerText = reply;
                document.getElementById('ai-input').value = ""; // ล้างช่องพิมพ์
            }, 1000);
        }

        async function reportViolation(type) {
            fetch(`${SB_URL}/rest/v1/event`, {
                method: 'POST',
                headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ id_num: "1425101665", event_type: "ALERT", status: type })
            });
        }

        setInterval(updateUI, 1000);
        window.onload = () => { updateUI(); loadHistory(); };
    </script>
</body>
    </html>
