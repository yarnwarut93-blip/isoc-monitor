<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISOC01 - AI COMMAND CENTER</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; margin: 0; overflow-x: hidden; }
        .panel { border: 2px solid #0f0; padding: 15px; margin-bottom: 20px; background: rgba(0, 255, 0, 0.05); }
        .log-box { height: 200px; border: 1px solid #333; overflow-y: auto; padding: 10px; font-size: 12px; color: #00ff41; background: #050505; margin-bottom: 10px; }
        .critical { color: #ff3e3e; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        button { background: #0f0; color: #000; border: none; padding: 15px; width: 100%; cursor: pointer; font-weight: bold; font-size: 16px; border-radius: 4px; box-shadow: 0 0 10px #0f0; }
        .ai-panel { border: 2px solid #0080ff; background: rgba(0, 128, 255, 0.1); padding: 15px; border-radius: 4px; margin-top: 10px; }
        #ai-input { width: 70%; background: #111; color: #0f0; border: 1px solid #0080ff; padding: 10px; margin-top: 10px; }
        .ask-btn { width: 25%; background: #0080ff; padding: 10px; font-size: 12px; display: inline-block; vertical-align: middle; margin-top: 10px; margin-left: 2%; color: #fff; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <audio id="alert-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
    <audio id="warning-sound" src="https://actions.google.com/sounds/v1/alarms/emergency_it_is_an_emergency.ogg"></audio>

    <div class="panel">
        <div>🛡️ <b>ISOC01: SIGNAL DEFENDER</b></div>
        <div>🆔 ID: 1425101665</div>
        <div>📡 STATUS: <span id="status">[INIT]</span></div>
        <div>⏰ TIME: <span id="clock">--:--:--</span></div>
        <div style="font-size: 10px; color: #888; text-align: right;">ANTI-TAMPERING: ACTIVE</div>
    </div>

    <div class="log-box" id="logs">[SYSTEM] Cloud Sync Complete.</div>
    <button onclick="handleScan()">ACTIVATE SECURITY SCAN</button>

    <div class="ai-panel">
        <div style="color: #0080ff; font-weight: bold;">🤖 AI SECURITY ANALYST: ONLINE</div>
        <div id="ai-response" style="font-size: 12px; margin: 10px 0; color: #aaa; min-height: 40px;">
            AI พร้อมปฏิบัติการ... กรุณาพิมพ์คำสั่งวิเคราะห์
        </div>
        <input type="text" id="ai-input" placeholder="พิมพ์คำถามที่นี่...">
        <button class="ask-btn" onclick="askAI()">ASK</button>
    </div>

    <script type="importmap">
      { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
    </script>
    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        // ✅ อัปเดตรหัส API Key ล่าสุดที่คุณส่งมาให้แล้ว
        const API_KEY = "AIzaSyDhC8Cuu2pIqfvZx6aDRUn5W0bmpaGtSKU"; 
        const genAI = new GoogleGenerativeAI(API_KEY);

        window.handleScan = async function() {
            document.getElementById('alert-sound').play().catch(() => {});
            const logBox = document.getElementById('logs');
            const time = new Date().toLocaleTimeString();
            logBox.prepend(document.createElement('div')).innerText = `[${time}] > ⚡ SCANNING...`;
            document.getElementById('ai-response').innerHTML = "<span style='color:#0f0'>✅ การสแกนสำเร็จ:</span> ข้อมูลถูกส่งไปประมวลผลบนคลาวด์แล้ว";
        };

        window.askAI = async function() {
            const input = document.getElementById('ai-input').value;
            const resBox = document.getElementById('ai-response');
            if (!input) return;

            resBox.innerText = "🤖 สมองกล Gemini กำลังวิเคราะห์ข้อมูลความปลอดภัย...";
            resBox.style.color = "#0080ff";
            
            try {
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
                const result = await model.generateContent("ในฐานะผู้เชี่ยวชาญ ISOC01 จงตอบแบบสั้น: " + input);
                const response = await result.response;
                resBox.innerHTML = `<b>วิเคราะห์:</b> ${response.text()}`;
                document.getElementById('ai-input').value = "";
            } catch (error) {
                // หากยังติดปัญหา จะแจ้งเตือนทางหน้าจอพร้อมส่งเสียงไซเรน
                resBox.innerText = "⚠️ ข้อผิดพลาด: ไม่สามารถเชื่อมต่อ Google AI ได้ โปรดตรวจสอบสถานะ API Key";
                document.getElementById('warning-sound').play().catch(() => {});
                console.error(error);
            }
        };

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
            const status = document.getElementById('status');
            const hour = now.getHours();
            if (hour >= 16 || hour < 6) {
                status.innerText = "[CRITICAL-WATCH]"; status.className = "critical"; // แจ้งเตือนสีแดงกระพริบ
            } else {
                status.innerText = "[NORMAL]"; status.className = "";
            }
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
