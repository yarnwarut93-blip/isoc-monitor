<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISOC01 - SIGNAL DEFENDER</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; margin: 0; }
        .panel { border: 2px solid #0f0; padding: 15px; margin-bottom: 20px; background: rgba(0, 255, 0, 0.05); }
        .log-box { height: 350px; border: 1px solid #333; overflow-y: auto; padding: 10px; font-size: 12px; color: #00ff41; background: #050505; }
        .critical { color: #ff3e3e; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        button { background: #0f0; color: #000; border: none; padding: 15px; width: 100%; cursor: pointer; font-weight: bold; font-size: 16px; border-radius: 4px; box-shadow: 0 0 10px #0f0; }
        button:active { transform: scale(0.98); background: #00cc00; }
        .info { font-size: 14px; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="panel">
        <div class="info">🛡️ <b>ISOC01: SIGNAL DEFENDER</b></div>
        <div class="info">🆔 ID: 1425101665</div>
        <div class="info">📡 STATUS: <span id="status">INIT...</span></div>
        <div class="info">⏰ TIME: <span id="clock">--:--:--</span></div>
    </div>

    <div class="log-box" id="logs">
        [SYSTEM] Cloud Connection: READY<br>
        [SYSTEM] Table 'event' detected...<br>
        [SYSTEM] Standby for security commands...
    </div>
    <br>
    <button onclick="handleScan()">ACTIVATE SECURITY SCAN</button>

    <script>
        // ข้อมูลจาก Supabase ของคุณ
        const SB_URL = "https://wmqzowyegkyrhlqsforb.supabase.co";
        const SB_KEY = "sb_publishable_ZziZCfjeYMaxhmJrOHwhSg_tzY-h5IM";

        function updateUI() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
            const hour = now.getHours();
            const status = document.getElementById('status');
            
            // โหมดเฝ้าระวัง 16:00 - 06:00
            if (hour >= 16 || hour < 6) {
                status.innerText = "[CRITICAL-WATCH]";
                status.className = "critical";
            } else {
                status.innerText = "[NORMAL-MONITORING]";
                status.className = "";
            }
        }

        async function handleScan() {
            const logBox = document.getElementById('logs');
            const time = new Date().toLocaleTimeString();
            
            // 1. แสดงผลบนหน้าจอ
            const logEntry = document.createElement('div');
            logEntry.innerHTML = `[${time}] > ⚡ SCANNING...`;
            logBox.prepend(logEntry);

            // 2. ส่งข้อมูลไปที่ Supabase
            try {
                const response = await fetch(`${SB_URL}/rest/v1/event`, {
                    method: 'POST',
                    headers: {
                        'apikey': SB_KEY,
                        'Authorization': `Bearer ${SB_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({
                        id_num: "1425101665",
                        event_type: "SECURITY_SCAN",
                        status: "SUCCESS"
                    })
                });

                if (response.ok) {
                    const successLog = document.createElement('div');
                    successLog.style.color = "#0f0";
                    successLog.innerHTML = `[${time}] > ✅ SYNCED TO SIGNALDEFENDER DB`;
                    logBox.prepend(successLog);
                }
            } catch (err) {
                const errLog = document.createElement('div');
                errLog.style.color = "yellow";
                errLog.innerHTML = `[${time}] > ⚠️ DATABASE OFFLINE`;
                logBox.prepend(errLog);
            }
        }

        setInterval(updateUI, 1000);
        updateUI();
    </script>
</body>
</html>
